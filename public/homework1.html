<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phipa Libunao - Profile Card</title>
  <style>
    body {
      background-image: url('../assets/cshomeworkbg5.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      font-family: 'Poppins', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .card {
      background-color: rgba(255, 244, 230, 0.88);
      color: #7b1e1e;
      text-align: center;
      padding: 25px 40px;
      border: 2px solid #b84a4a;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
      width: 280px;
      transition: all 0.4s ease;
      backdrop-filter: blur(4px);
    }

    .card:hover {
      background-color: #7b1e1e;
      color: #fce9dc;
      transform: scale(1.05);
      border-color: #732020;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 15px;
      font-family: 'Georgia', serif;
    }

    p {
      font-size: 0.9rem;
      line-height: 1.5;
      margin: 6px 0;
      font-family: 'Courier New', monospace;
    }

    .hobby {
      font-style: italic;
    }

    .fact {
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>about me ✦</h1>
    <p><strong>name:</strong> Phipa Libunao</p>
    <p class="hobby"><strong>favorite hobby:</strong> writing & playing the guitar</p>
    <p class="fact"><strong>fun fact:</strong> my middle name actually stands for maximoff /j</p>
  </div>
</body>
</html>
